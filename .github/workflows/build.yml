name: Build Extension
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension
        run: |
          cd src
          zip -r ../gemini-ex.zip *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-ex
          path: gemini-ex.zip
